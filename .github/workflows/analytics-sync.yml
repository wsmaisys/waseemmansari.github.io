name: Sync GA4 Analytics Data

on:
  schedule:
    # Runs automatically every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab
  push:
    paths:
      - 'scripts/sync_ga4.py'

permissions:
  contents: write

jobs:
  sync-analytics:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Google Analytics Data API SDK
        run: |
          python -m pip install --upgrade pip
          pip install google-analytics-data google-auth

      - name: Query GA4 & Update data/analytics.json
        env:
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          GA4_CREDENTIALS_JSON: ${{ secrets.GA4_CREDENTIALS_JSON }}
        run: |
          python scripts/sync_ga4.py

      - name: Commit & Push Analytics Telemetry
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/analytics.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(telemetry): automated GA4 metrics sync [skip ci]" && git push)
